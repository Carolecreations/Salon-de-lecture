<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D3A4A"/>
      <stop offset="100%" stop-color="#3D2030"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="100%" stop-color="#E8D9B8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond prune avec coins arrondis -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Halo lumineux -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#glow)"/>

  <!-- Bordure dorée fine -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96"
        fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.4"/>

  <!-- Livre ouvert — page gauche -->
  <path d="M 100 200
           Q 160 180 256 220
           L 256 380
           Q 160 340 100 360
           Z"
        fill="url(#pageGrad)"
        stroke="#D4AF37" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Livre ouvert — page droite -->
  <path d="M 412 200
           Q 352 180 256 220
           L 256 380
           Q 352 340 412 360
           Z"
        fill="url(#pageGrad)"
        stroke="#D4AF37" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Reliure centrale -->
  <line x1="256" y1="220" x2="256" y2="380"
        stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>

  <!-- Lignes de texte suggestives — page gauche -->
  <g stroke="#8B6F4E" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="125" y1="245" x2="235" y2="255"/>
    <line x1="120" y1="275" x2="235" y2="285"/>
    <line x1="122" y1="305" x2="235" y2="310"/>
    <line x1="125" y1="335" x2="220" y2="340"/>
  </g>

  <!-- Lignes de texte suggestives — page droite -->
  <g stroke="#8B6F4E" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="277" y1="255" x2="387" y2="245"/>
    <line x1="277" y1="285" x2="392" y2="275"/>
    <line x1="277" y1="310" x2="390" y2="305"/>
    <line x1="277" y1="340" x2="385" y2="335"/>
  </g>

  <!-- Marque-page doré -->
  <path d="M 340 200 L 340 290 L 355 270 L 370 290 L 370 200 Z"
        fill="url(#bookGrad)"
        stroke="#8B6F4E" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Petite étoile décorative en haut à droite -->
  <g transform="translate(420, 100)" fill="#D4AF37" opacity="0.7">
    <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z"/>
  </g>

  <!-- Petite étoile décorative en bas à gauche -->
  <g transform="translate(92, 412)" fill="#D4AF37" opacity="0.5">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z"/>
  </g>
</svg>