<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Salon de lecture</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5D3A4A">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --prune:#5D3A4A;
  --prune-clair:#8B5A6B;
  --or:#D4AF37;
  --creme:#F5F2E9;
  --bois:#2A1B14;
  --texte-dim:rgba(245,242,233,.65);
  --radius:4px;
  --shadow:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background-color:#1a0f0a;
  background-image:
    radial-gradient(ellipse at 50% 100%, rgba(93,58,74,.4) 0%, transparent 60%),
    linear-gradient(180deg, #2A1B14 0%, #1a0f0a 100%);
  color:var(--creme);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; gap:20px;
  padding:16px 32px;
  background:rgba(26,15,10,.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(212,175,55,.2);
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-icon{
  width:36px; height:36px; border-radius:50%;
  background:linear-gradient(135deg, var(--prune), var(--prune-clair));
  border:1px solid var(--or);
}
.brand h1{font-family:'Playfair Display',serif; font-size:20px; font-weight:600;}
.brand span{font-size:9px; letter-spacing:.3em; text-transform:uppercase; color:var(--or); display:block;}
.search-wrap{flex:1; max-width:500px; position:relative;}
.search-wrap input{
  width:100%; background:rgba(0,0,0,.4); border:1px solid rgba(212,175,55,.2);
  color:var(--creme); padding:10px 16px 10px 40px; border-radius:3px;
  font-size:13px; transition:.3s;
}
.search-wrap input:focus{outline:none; border-color:var(--or); background:rgba(0,0,0,.6);}
.search-wrap svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.6;}
.top-actions{margin-left:auto; display:flex; gap:10px;}

/* ---------- BOUTONS ---------- */
.btn{
  padding:9px 16px; border-radius:3px; font-size:11px; font-weight:500;
  letter-spacing:.08em; text-transform:uppercase; cursor:pointer;
  border:1px solid rgba(212,175,55,.3); background:transparent; color:var(--creme);
  transition:.2s; display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{border-color:var(--or); color:var(--or); background:rgba(212,175,55,.05);}
.btn.primary{background:linear-gradient(135deg, var(--or), #B4934F); color:#1a0f0a; border-color:transparent; font-weight:600;}
.btn.primary:hover{background:linear-gradient(135deg, #E2C893, var(--or));}

/* ---------- CONTRÔLES ---------- */
.controls{padding:20px 32px 0; display:flex; gap:20px; align-items:center; flex-wrap:wrap;}
.filter-group{display:flex; gap:8px; flex-wrap:wrap;}
.filter-btn{
  padding:6px 14px; border-radius:20px; font-size:11px;
  border:1px solid rgba(245,242,233,.15); background:transparent; color:var(--texte-dim);
  cursor:pointer; transition:.2s;
}
.filter-btn.active{background:var(--prune); border-color:var(--prune); color:var(--creme);}
.filter-btn:hover:not(.active){border-color:var(--or);}
.toolbar{margin-left:auto; display:flex; gap:10px;}
.select-mini{
  background:rgba(0,0,0,.4); border:1px solid rgba(212,175,55,.2);
  color:var(--creme); padding:8px 12px; border-radius:3px; font-size:11px;
  cursor:pointer;
}

/* ---------- ONGLETS ---------- */
.tabs-bar{
  display:flex; gap:4px; padding:16px 32px 0;
  border-bottom:1px solid rgba(212,175,55,.15);
}
.tab-btn{
  padding:10px 20px; font-family:'Inter',sans-serif;
  font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--texte-dim); background:transparent; border:none;
  border-bottom:2px solid transparent; cursor:pointer; transition:.2s;
}
.tab-btn.active{color:var(--or); border-bottom-color:var(--or);}
.tab-btn:hover:not(.active){color:var(--creme);}

/* ---------- GRILLE ---------- */
.library{
  padding:24px 32px 80px;
  display:none; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
  gap:24px;
}
.library.active{display:grid;}
.book-card{
  background:rgba(26,15,10,.7);
  border:1px solid rgba(212,175,55,.12);
  border-radius:var(--radius);
  overflow:hidden; cursor:pointer;
  transition:.3s;
  backdrop-filter:blur(4px);
}
.book-card:hover{
  transform:translateY(-4px);
  border-color:rgba(212,175,55,.4);
  box-shadow:var(--shadow);
}
.book-cover{
  aspect-ratio:2/3; background:rgba(93,58,74,.2);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; position:relative;
}
.book-cover img{width:100%; height:100%; object-fit:cover;}
.book-cover .placeholder{
  font-family:'Playfair Display',serif; font-size:48px;
  color:rgba(212,175,55,.3); font-style:italic;
}
.book-info{padding:12px 14px 10px;}
.book-title{
  font-family:'Playfair Display',serif; font-size:15px; line-height:1.3;
  margin-bottom:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.book-author{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--or);}
.book-meta{margin-top:8px; display:flex; gap:8px; font-size:10px; color:var(--texte-dim);}
.book-foot{
  padding:8px 14px; border-top:1px solid rgba(212,175,55,.08);
  display:flex; justify-content:space-between; align-items:center;
}
.status{font-size:9px; text-transform:uppercase; letter-spacing:.1em;}
.status.read{color:#8BC34A;}
.status.unread{color:var(--texte-dim);}
.fav{color:var(--or);}

/* ---------- MODALES ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.8);
  backdrop-filter:blur(8px); display:none;
  align-items:center; justify-content:center; z-index:200; padding:20px;
}
.modal-overlay.active{display:flex;}
.modal{
  background:linear-gradient(180deg,#2A1B14,#1a0f0a);
  border:1px solid rgba(212,175,55,.3); border-radius:6px;
  max-width:600px; width:100%; max-height:90vh; overflow-y:auto;
  padding:32px; box-shadow:var(--shadow);
}
.modal h2{font-family:'Playfair Display',serif; font-size:24px; margin-bottom:20px; color:var(--or);}
.form-group{margin-bottom:16px;}
.form-group label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--texte-dim); margin-bottom:6px;}
.form-group input,.form-group textarea,.form-group select{
  width:100%; background:rgba(0,0,0,.4); border:1px solid rgba(212,175,55,.2);
  color:var(--creme); padding:10px 14px; border-radius:3px; font-size:13px; font-family:'Inter',sans-serif;
}
.form-group input:focus,.form-group textarea:focus{outline:none; border-color:var(--or);}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:24px;}

/* ---------- ÉTAT VIDE ---------- */
.empty-state{
  grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--texte-dim);
  font-family:'Playfair Display',serif; font-style:italic; font-size:18px;
}

/* ---------- STATS ---------- */
.stat-box{
  grid-column:1/-1; display:grid;
  grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:16px;
}
.stat-card{
  background:rgba(26,15,10,.7); border:1px solid rgba(212,175,55,.15);
  border-radius:var(--radius); padding:24px; text-align:center;
}
.stat-card .num{font-family:'Playfair Display',serif; font-size:36px; color:var(--or);}
.stat-card .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--texte-dim); margin-top:6px;}

/* ---------- RESPONSIVE ---------- */
@media(max-width:768px){
  .topbar{padding:12px 16px; flex-wrap:wrap;}
  .search-wrap{order:3; flex-basis:100%; max-width:none;}
  .controls,.tabs-bar,.library{padding-left:16px; padding-right:16px;}
  .library{grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:16px;}
  .top-actions{width:100%; justify-content:flex-end;}
}
</style>
</head>
<body>

<!-- ================= TOPBAR ================= -->
<header class="topbar">
  <div class="brand">
    <div class="brand-icon"></div>
    <div>
      <h1>Le Salon de lecture</h1>
      <span>Bibliothèque personnelle</span>
    </div>
  </div>

  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="search" id="searchInput" placeholder="Rechercher un titre, un auteur…">
  </div>

  <div class="top-actions">
    <button class="btn" id="exportBtn">Exporter</button>
    <button class="btn" id="importBtn">Importer</button>
    <button class="btn primary" id="addBtn">+ Ajouter</button>
  </div>
</header>

<!-- ================= FILTRES ================= -->
<div class="controls">
  <div class="filter-group" id="filterGroup">
    <button class="filter-btn active" data-filter="all">Tous</button>
    <button class="filter-btn" data-filter="read">Lus</button>
    <button class="filter-btn" data-filter="unread">À lire</button>
    <button class="filter-btn" data-filter="favorite">Favoris</button>
  </div>
  <div class="toolbar">
    <select class="select-mini" id="sortSelect">
      <option value="recent">Ajout récent</option>
      <option value="title">Titre A→Z</option>
      <option value="author">Auteur A→Z</option>
      <option value="rating">Note</option>
    </select>
  </div>
</div>

<!-- ================= ONGLETS ================= -->
<nav class="tabs-bar">
  <button class="tab-btn active" data-tab="library">Bibliothèque</button>
  <button class="tab-btn" data-tab="wishlist">À acheter</button>
  <button class="tab-btn" data-tab="loans">Prêts</button>
  <button class="tab-btn" data-tab="stats">Statistiques</button>
</nav>

<!-- ================= GRILLES ================= -->
<main class="library active" id="libraryGrid"></main>
<main class="library" id="wishlistGrid"></main>
<main class="library" id="loansGrid"></main>
<main class="library" id="statsGrid"></main>

<!-- ================= MODALE DÉTAIL ================= -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <h2 id="detailTitle">—</h2>
    <div id="detailBody"></div>
    <div class="modal-actions">
      <button class="btn" data-close>Fermer</button>
      <button class="btn" id="deleteBtn">Supprimer</button>
      <button class="btn primary" id="editBtn">Modifier</button>
    </div>
  </div>
</div>

<!-- ================= MODALE FORMULAIRE ================= -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h2 id="formTitle">Ajouter un livre</h2>
    <form id="bookForm">
      <div class="form-group"><label>Titre</label><input name="title" required></div>
      <div class="form-group"><label>Auteur</label><input name="author" required></div>
      <div class="form-group"><label>Année</label><input name="year" type="number" min="0" max="2100"></div>
      <div class="form-group"><label>Genre</label><input name="genre"></div>
      <div class="form-group"><label>Note (1-5)</label><input name="rating" type="number" min="1" max="5"></div>
      <div class="form-group"><label>Couverture (URL)</label><input name="cover" type="url"></div>
      <div class="form-group"><label>Notes</label><textarea name="notes" rows="3"></textarea></div>
      <div class="form-group"><label>Statut</label>
        <select name="read">
          <option value="false">À lire</option>
          <option value="true">Lu</option>
        </select>
      </div>
      <div class="form-group"><label>Favori</label>
        <select name="favorite">
          <option value="false">Non</option>
          <option value="true">Oui</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Annuler</button>
        <button type="submit" class="btn primary">Enregistrer</button>
      </div>
    </form>
  </div>
</div>
<script>
/* =========================================================
   ÉTAT & PERSISTANCE
   ========================================================= */
const STORAGE_KEY = 'salon-lecture-books';
let books = [];
try { books = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e){ books = []; }

let currentFilter = 'all';
let currentSort   = 'recent';
let currentTab    = 'library';
let editingId     = null;

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(books)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* =========================================================
   FILTRAGE & TRI
   ========================================================= */
function getFilteredBooks(){
  let list = [...books];
  const q = document.getElementById('searchInput').value.toLowerCase().trim();

  if(q) list = list.filter(b =>
    (b.title||'').toLowerCase().includes(q) ||
    (b.author||'').toLowerCase().includes(q)
  );

  if(currentFilter === 'read')     list = list.filter(b => b.read);
  if(currentFilter === 'unread')   list = list.filter(b => !b.read);
  if(currentFilter === 'favorite') list = list.filter(b => b.favorite);

  const sorters = {
    recent: (a,b) => (b.addedAt||0) - (a.addedAt||0),
    title:  (a,b) => (a.title||'').localeCompare(b.title||''),
    author: (a,b) => (a.author||'').localeCompare(b.author||''),
    rating: (a,b) => (b.rating||0) - (a.rating||0),
  };
  return list.sort(sorters[currentSort] || sorters.recent);
}

/* =========================================================
   RENDU DES CARTES
   ========================================================= */
function renderCard(book){
  const card = document.createElement('div');
  card.className = 'book-card';
  card.dataset.id = book.id;
  const firstLetter = (book.title||'?').charAt(0).toUpperCase();
  card.innerHTML = `
    <div class="book-cover">
      ${book.cover
        ? `<img src="${book.cover}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'placeholder',textContent:'${firstLetter}'}))">`
        : `<span class="placeholder">${firstLetter}</span>`}
    </div>
    <div class="book-info">
      <div class="book-title">${book.title||'Sans titre'}</div>
      <div class="book-author">${book.author||'Auteur inconnu'}</div>
      <div class="book-meta">
        <span>${book.year||'—'}</span>
        ${book.rating ? `<span>★ ${book.rating}</span>` : ''}
      </div>
    </div>
    <div class="book-foot">
      <span class="status ${book.read ? 'read':'unread'}">${book.read ? 'Lu':'À lire'}</span>
      <span class="fav">${book.favorite ? '♥' : ''}</span>
    </div>`;
  card.addEventListener('click', () => openDetail(book.id));
  return card;
}

function renderStats(){
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = '';
  const total    = books.length;
  const read     = books.filter(b => b.read).length;
  const unread   = total - read;
  const favs     = books.filter(b => b.favorite).length;
  const avg      = books.filter(b=>b.rating).reduce((s,b)=>s+b.rating,0) / (books.filter(b=>b.rating).length||1);
  const box = document.createElement('div');
  box.className = 'stat-box';
  box.innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">Livres</div></div>
    <div class="stat-card"><div class="num">${read}</div><div class="lbl">Lus</div></div>
    <div class="stat-card"><div class="num">${unread}</div><div class="lbl">À lire</div></div>
    <div class="stat-card"><div class="num">${favs}</div><div class="lbl">Favoris</div></div>
    <div class="stat-card"><div class="num">${avg.toFixed(1)}</div><div class="lbl">Note moyenne</div></div>`;
  grid.appendChild(box);
}

function render(){
  document.querySelectorAll('.library').forEach(g => g.classList.remove('active'));

  if(currentTab === 'stats'){
    document.getElementById('statsGrid').classList.add('active');
    renderStats();
    return;
  }

  const gridId = currentTab === 'library' ? 'libraryGrid'
               : currentTab === 'wishlist' ? 'wishlistGrid'
               : 'loansGrid';
  const grid = document.getElementById(gridId);
  grid.classList.add('active');
  grid.innerHTML = '';

  const list = getFilteredBooks();
  if(!list.length){
    grid.innerHTML = '<div class="empty-state">Aucun livre pour le moment…</div>';
    return;
  }
  list.forEach(b => grid.appendChild(renderCard(b)));
}

/* =========================================================
   MODALES
   ========================================================= */
function openDetail(id){
  const book = books.find(b => b.id === id);
  if(!book) return;
  editingId = id;
  document.getElementById('detailTitle').textContent = book.title || 'Sans titre';
  document.getElementById('detailBody').innerHTML = `
    <p><strong>Auteur :</strong> ${book.author||'—'}</p>
    <p><strong>Année :</strong> ${book.year||'—'}</p>
    <p><strong>Genre :</strong> ${book.genre||'—'}</p>
    <p><strong>Note :</strong> ${book.rating ? '★'.repeat(book.rating) : '—'}</p>
    <p><strong>Statut :</strong> ${book.read ? 'Lu' : 'À lire'}</p>
    <p><strong>Favori :</strong> ${book.favorite ? 'Oui' : 'Non'}</p>
    <p style="margin-top:12px;"><strong>Notes :</strong><br>${(book.notes||'—').replace(/\n/g,'<br>')}</p>`;
  document.getElementById('detailModal').classList.add('active');
}

function openForm(book=null){
  editingId = book ? book.id : null;
  document.getElementById('formTitle').textContent = book ? 'Modifier le livre' : 'Ajouter un livre';
  const f = document.getElementById('bookForm');
  f.reset();
  if(book){
    ['title','author','year','genre','rating','cover','notes'].forEach(k => { if(f[k]) f[k].value = book[k] ?? ''; });
    if(f.read)     f.read.value     = String(!!book.read);
    if(f.favorite) f.favorite.value = String(!!book.favorite);
  }
  document.getElementById('formModal').classList.add('active');
}

document.getElementById('bookForm').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  const data = {
    title:    f.title.value.trim(),
    author:   f.author.value.trim(),
    year:     f.year.value ? Number(f.year.value) : null,
    genre:    f.genre.value.trim(),
    rating:   f.rating.value ? Number(f.rating.value) : 0,
    cover:    f.cover.value.trim(),
    notes:    f.notes.value.trim(),
    read:     f.read.value === 'true',
    favorite: f.favorite.value === 'true',
  };

  if(editingId){
    const i = books.findIndex(b => b.id === editingId);
    if(i > -1) books[i] = { ...books[i], ...data };
  } else {
    books.push({ id: uid(), addedAt: Date.now(), ...data });
  }
  save(); render();
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
});

/* =========================================================
   IMPORT / EXPORT
   ========================================================= */
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(books,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'salon-lecture-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

document.getElementById('importBtn').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = async () => {
    if(!input.files[0]) return;
    try {
      const text = await input.files[0].text();
      const data = JSON.parse(text);
      if(!Array.isArray(data)) throw new Error('Format invalide');
      data.forEach(b => {
        if(!b.id) b.id = uid();
        if(!b.addedAt) b.addedAt = Date.now();
      });
      books = books.concat(data);
      save(); render();
      alert(data.length + ' livre(s) importé(s).');
    } catch(err){
      alert('Fichier JSON invalide : ' + err.message);
    }
  };
  input.click();
});

/* =========================================================
   ÉVÉNEMENTS GLOBAUX
   ========================================================= */
document.getElementById('searchInput').addEventListener('input', render);

document.getElementById('filterGroup').addEventListener('click', e => {
  if(!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter = e.target.dataset.filter;
  render();
});

document.getElementById('sortSelect').addEventListener('change', e => {
  currentSort = e.target.value;
  render();
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    render();
  });
});

document.querySelectorAll('[data-close]').forEach(b =>
  b.addEventListener('click', () => b.closest('.modal-overlay').classList.remove('active'))
);
document.querySelectorAll('.modal-overlay').forEach(m =>
  m.addEventListener('click', e => { if(e.target === m) m.classList.remove('active'); })
);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
});

document.getElementById('addBtn').addEventListener('click', () => openForm());
document.getElementById('editBtn').addEventListener('click', () => {
  const book = books.find(b => b.id === editingId);
  document.getElementById('detailModal').classList.remove('active');
  openForm(book);
});
document.getElementById('deleteBtn').addEventListener('click', () => {
  if(!editingId) return;
  if(!confirm('Supprimer ce livre ?')) return;
  books = books.filter(b => b.id !== editingId);
  save(); render();
  document.getElementById('detailModal').classList.remove('active');
});

/* =========================================================
   PWA — SERVICE WORKER
   ========================================================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

/* =========================================================
   INIT
   ========================================================= */
render();
</script>
</body>
</html>
